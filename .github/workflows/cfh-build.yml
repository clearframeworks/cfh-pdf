name: Office branding and donation inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch exact CFH Office source
        run: |
          set -euo pipefail
          git -c core.autocrlf=false clone --depth 1 --branch cfh-office-26-8-2-2 https://github.com/clearframeworks/cfh-office.git "$RUNNER_TEMP/office"
          cd "$RUNNER_TEMP/office"
          test "$(git rev-parse HEAD)" = 4f58d63d6beea882e8743564f58fcdaa2c26cb81
          for f in intro.png intro-highres.png logo.svg logo_inverted.svg logo-sc.svg logo-sc_inverted.svg about.svg donate1.png donate2.png; do test -s "cfh-brand/$f"; done
          echo ALL_NINE_BRANDING_FILES_PRESENT
      - name: Inspect donation destinations and branding assets
        run: |
          cd "$RUNNER_TEMP/office"
          git grep -n -i -E 'donat(e|ion)|libreoffice.org/donat' -- desktop sfx2 officecfg svx 2>/dev/null | head -n 120 || true
          echo DONATION_COMMAND_FILES
          git grep -l -F '.uno:Donation' || true
          find sysui -type f \( -iname '*.ico' -o -iname '*logo*' -o -iname '*intro*' \) | head -n 100
      - name: Verify donation-control transformation
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/office"
          python3 cfh-build/remove-donation.py
          echo REMAINING_DONATION_UI_REFERENCES
          if git grep -n -F '.uno:Donation' -- '*/uiconfig/*.xml' '*/uiconfig/*.ui'; then exit 1; fi
          git diff --stat
          test "$(git diff --name-only | wc -l)" -eq 34
          git diff --binary > "$RUNNER_TEMP/cfh-office-donation-transform.patch"
          sha256sum "$RUNNER_TEMP/cfh-office-donation-transform.patch"
          python3 cfh-build/remove-donation.py
      - name: Verify profile-independent donation source changes
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/office"
          grep -F 'const bool bShowDonation(false);' sfx2/source/dialog/backingwindow.cxx
          if grep -F 'AppendInfoBar(u"donate"' sfx2/source/view/viewfrm.cxx; then exit 1; fi
          python3 - <<'PY'
          import pathlib
          t=pathlib.Path('sfx2/source/appl/appserv.cxx').read_text()
          section=t.split('case SID_DONATION:',1)[1].split('case SID_WHATSNEW:',1)[0]
          assert 'openUriExternally' not in section and 'break;' in section
          print('DONATION_DISPATCH_DISABLED')
          PY
      - name: Retain corresponding source transformation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cfh-office-source-transformation-4f58d63d
          path: ${{ runner.temp }}/cfh-office-donation-transform.patch
          if-no-files-found: error
          retention-days: 7