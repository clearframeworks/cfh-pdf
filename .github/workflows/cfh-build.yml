name: Attach tested PDF release asset
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Attach exact tested installer to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh api repos/clearframeworks/cfh-pdf/actions/runs/42406478208 --jq .conclusion)
          test "$run" = success
          gh run download 42406478208 --repo clearframeworks/cfh-pdf -n cfh-pdf-installer-unsigned -D "$RUNNER_TEMP/installer"
          file="$RUNNER_TEMP/installer/CFH-PDF-Setup.exe"
          echo 'a921a953041be099e596196bff524e13e0bb607a9227f5dcb4e511c528acba82  '"$file" | sha256sum -c -
          gh release upload cfh-pdf-0.1.0 "$file" --repo clearframeworks/cfh-pdf