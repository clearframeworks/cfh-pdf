name: CFH XML encoding error probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Build isolated libxml versions with AddressSanitizer
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/GNOME/libxml2.git "$RUNNER_TEMP/libxml2"
          cat > "$RUNNER_TEMP/check.c" <<'EOF'
          #include <libxml/HTMLparser.h>
          #include <libxml/HTMLtree.h>
          #include <string.h>
          int main(void) {
            const char *src="<html><body>test</body></html>";
            htmlDocPtr doc=htmlReadMemory(src,(int)strlen(src),"test.html",NULL,0);
            if(!doc) return 3;
            int n=htmlSaveFileFormat("/nonexistent-cfh-test-dir/out.html",doc,"ISO-8859-1",1);
            xmlFreeDoc(doc); xmlCleanupParser();
            return n > 0 ? 4 : 0;
          }
          EOF
          for revision in 36ea881b9d92166568b1d107181a05f673fd4ab1 v2.15.4; do
            cd "$RUNNER_TEMP/libxml2"
            git reset --hard -q "$revision"
            git clean -fdxq
            echo "REVISION $revision $(git rev-parse HEAD)"
            CC=clang CFLAGS='-O1 -g -fsanitize=address -fno-omit-frame-pointer' LDFLAGS='-fsanitize=address' ./autogen.sh --disable-shared --without-python --without-lzma --without-zlib > "$RUNNER_TEMP/configure-$revision.log" 2>&1
            make -j2 > "$RUNNER_TEMP/build-$revision.log" 2>&1
            clang -O1 -g -fsanitize=address -fno-omit-frame-pointer -Iinclude -I. "$RUNNER_TEMP/check.c" .libs/libxml2.a -lm -o "$RUNNER_TEMP/check-$revision"
            set +e
            ASAN_OPTIONS=detect_leaks=0 "$RUNNER_TEMP/check-$revision" > "$RUNNER_TEMP/run-$revision.log" 2>&1
            result=$?
            set -e
            echo "CHECK RESULT $revision $result"
            head -n 60 "$RUNNER_TEMP/run-$revision.log"
          done
