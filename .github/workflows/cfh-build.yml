name: CFH Office sampled source dependency advisories
on:
  workflow_dispatch:
permissions: {}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query selected source inputs against OSV
        run: |
          python3 - <<'PY'
          import json, urllib.request
          # These are selected upstream source manifest versions, not a complete shipped SBOM.
          packages=[('curl','8.23.0'),('expat','2.9.0'),('freetype2','2.15.0'),('icu','78.3'),('libwebp','1.6.0'),('libxml2','2.15.4'),('nss','3.132'),('openssl','3.5.9'),('libpng','1.6.59'),('libtiff','4.7.2'),('zlib','1.3.2'),('zstd','1.5.7')]
          request=urllib.request.Request('https://api.osv.dev/v1/querybatch',data=json.dumps({'queries':[{'package':{'name':name,'ecosystem':'OSS-Fuzz'},'version':version} for name,version in packages]}).encode(),headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=60) as response: results=json.load(response)['results']
          if len(results)!=len(packages): raise RuntimeError('Unexpected OSV response count')
          for (name,version),result in zip(packages,results): print(name,version,'advisories',','.join(v['id'] for v in result.get('vulns',[])) or 'none reported')
          print('SAMPLED OSS-FUZZ ECOSYSTEM QUERIES ONLY; missing results do not prove safety')
          PY
