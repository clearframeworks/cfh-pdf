name: Inspect synthetic Impress test dialog
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect synthetic screenshot on runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/clearframeworks/cfh-pdf/actions/artifacts/13617910095/zip > "$RUNNER_TEMP/popup.zip"
          mkdir "$RUNNER_TEMP/popup"
          unzip -q "$RUNNER_TEMP/popup.zip" -d "$RUNNER_TEMP/popup"
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          find "$RUNNER_TEMP/popup" -type f -name '*.png' -exec tesseract {} stdout tsv \; 2>/dev/null
