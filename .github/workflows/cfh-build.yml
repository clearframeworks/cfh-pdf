name: CFH Office runtime prerequisite negative probe
on:
  workflow_dispatch:
permissions:
  actions: read
jobs:
  runtime:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Fetch exact installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip="$env:RUNNER_TEMP\installer.zip"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest 'https://api.github.com/repos/clearframeworks/cfh-pdf/actions/artifacts/13607111226/zip' -Headers $headers -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '79aa85430478e3dcb077bd9b9dbc21a446c5f7cd564f7eddd5797013e2d277ab'){throw 'Installer archive digest mismatch'}
          Expand-Archive $zip "$env:RUNNER_TEMP\package" -Force
          $setup=Get-ChildItem "$env:RUNNER_TEMP\package\*.exe" | Select-Object -First 1
          if((Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne '37ef3929d54edb8ffcc6dd26ce3cac649d947f536e8d963900811fe63f7a4586'){throw 'Installer digest mismatch'}
      - name: Test absent and outdated registry prerequisites
        shell: pwsh
        timeout-minutes: 5
        run: |
          $key='HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64'
          if(!(Test-Path $key)){throw 'Runner runtime key absent before test; no mutation attempted'}
          $original=Get-ItemProperty $key -Name Installed,Major,Minor,Bld
          foreach($name in @('Installed','Major','Minor','Bld')){if($null -eq $original.$name){throw "Runner registry value missing before test: $name"}}
          if($original.Installed -ne 1 -or $original.Major -lt 14 -or ($original.Major -eq 14 -and ($original.Minor -lt 44 -or ($original.Minor -eq 44 -and $original.Bld -lt 35207)))){throw 'Runner runtime does not meet baseline prerequisite'}
          $reg=Get-Item $key
          foreach($name in @('Installed','Major','Minor','Bld')){if($reg.GetValueKind($name) -ne [Microsoft.Win32.RegistryValueKind]::DWord){throw "Unexpected registry type: $name"}}
          $setup=(Get-ChildItem "$env:RUNNER_TEMP\package\*.exe" | Select-Object -First 1).FullName
          try {
            foreach($scenario in @('missing','outdated')){
              if($scenario -eq 'missing'){Set-ItemProperty -Path $key -Name Installed -Type DWord -Value 0}
              else {
                Set-ItemProperty -Path $key -Name Installed -Type DWord -Value 1
                Set-ItemProperty -Path $key -Name Major -Type DWord -Value 14
                Set-ItemProperty -Path $key -Name Minor -Type DWord -Value 43
                Set-ItemProperty -Path $key -Name Bld -Type DWord -Value 0
              }
              $dest="$env:RUNNER_TEMP\blocked-$scenario"
              $before=@(Get-Process msedge,chrome,firefox -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
              $p=Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dest","/LOG=$env:RUNNER_TEMP\$scenario.log") -PassThru
              if(!$p.WaitForExit(45000)){Stop-Process -Id $p.Id -Force; throw "$scenario silent setup hung"}
              if($p.ExitCode -eq 0 -or (Test-Path (Join-Path $dest 'program\soffice.com'))){throw "$scenario runtime was not blocked"}
              Write-Output "RUNTIME $scenario blocked with exit $($p.ExitCode)"
              if(!(Test-Path "$env:RUNNER_TEMP\$scenario.log") -or !((Get-Content "$env:RUNNER_TEMP\$scenario.log" -Raw) -match 'Missing or outdated Microsoft Visual C\+\+ x64 runtime')){throw "$scenario did not report prerequisite cause"}
              $after=@(Get-Process msedge,chrome,firefox -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Id)
              if(@($after | Where-Object {$_ -notin $before}).Count -gt 0){throw "$scenario launched a browser in silent mode"}
            }
          } finally {
            foreach($name in @('Installed','Major','Minor','Bld')){Set-ItemProperty -Path $key -Name $name -Type DWord -Value $original.$name}
            $restored=Get-ItemProperty $key -Name Installed,Major,Minor,Bld
            foreach($name in @('Installed','Major','Minor','Bld')){if($restored.$name -ne $original.$name){throw "Runtime registry restoration failed: $name"}}
            Write-Output 'Disposable runner runtime registry restored'
          }
