name: CFH Office XML source trace
on:
  workflow_dispatch:
permissions: {}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trace exact source and patch configuration
        run: |
          set -euo pipefail
          git clone --depth 1 --branch cfh-office-26-8-2-2 https://github.com/clearframeworks/cfh-office.git "$RUNNER_TEMP/office"
          cd "$RUNNER_TEMP/office"
          test "$(git rev-parse HEAD)" = 4f58d63d6beea882e8743564f58fcdaa2c26cb81
          echo LIBXML_MANIFEST
          grep -E '^LIBXML_(SHA256SUM|VERSION_MICRO|TARBALL)' download.lst
          echo LIBXML_PATCHES
          cat external/libxml2/UnpackedTarball_libxml2.mk
          cat external/libxml2/ExternalProject_libxml2.mk
          for symbol in htmlSaveFileFormat xmlCharEncCloseFunc xmlXIncludeProcess xmlAddNextSibling; do
            echo "SOURCE REFERENCES $symbol"
            git grep -n -F "$symbol" -- ':!external/libxml2/*' | head -n 100 || true
          done
