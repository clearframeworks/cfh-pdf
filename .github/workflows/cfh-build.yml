name: Inspect Office environment bootstrap
on:
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect upstream LODE scripts
        run: |
          set -euo pipefail
          git -c core.autocrlf=false clone --depth 1 https://git.libreoffice.org/lode "$RUNNER_TEMP/lode"
          cd "$RUNNER_TEMP/lode"
          git rev-parse HEAD
          cat bin/utils_Cygwin.sh
          sed -n '150,340p' setup