name: CFH Office denied cleanup probe
on:
  workflow_dispatch:
permissions:
  actions: read
jobs:
  runtime:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Fetch exact installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip="$env:RUNNER_TEMP\installer.zip"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest 'https://api.github.com/repos/clearframeworks/cfh-pdf/actions/artifacts/13606783929/zip' -Headers $headers -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '14c4d37e2947d66c9fcad705e8edbc71e44ab43596558c8e3d4b7fad8012a383'){throw 'Installer archive digest mismatch'}
          Expand-Archive $zip "$env:RUNNER_TEMP\package" -Force
          $setup=Get-ChildItem "$env:RUNNER_TEMP\package\*.exe" | Select-Object -First 1
          if((Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne '330efe105cfd966a5a8bc3abf73b3a3432ea3651e08b33d449dd2ccfd2983d24'){throw 'Installer digest mismatch'}
      - name: Test denied registry cleanup and recovery
        shell: pwsh
        timeout-minutes: 7
        run: |
          $setup=(Get-ChildItem "$env:RUNNER_TEMP\package\*.exe" | Select-Object -First 1).FullName
          $dir="$env:RUNNER_TEMP\installed-office"
          $key='HKCU:\Software\Classes\Applications\CFHOffice.exe\SupportedTypes'
          if(Test-Path 'HKCU:\Software\Classes\Applications\CFHOffice.exe'){throw 'Unexpected pre-existing registration'}
          $p=Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=associations',"/DIR=$dir") -Wait -PassThru
          if($p.ExitCode -ne 0 -or !(Test-Path $key)){throw 'Setup failed before denial test'}
          $original=Get-Acl -LiteralPath $key
          $denied=Get-Acl -LiteralPath $key
          $sid=[Security.Principal.WindowsIdentity]::GetCurrent().User
          $rule=[Security.AccessControl.RegistryAccessRule]::new($sid,[Security.AccessControl.RegistryRights]::SetValue,[Security.AccessControl.AccessControlType]::Deny)
          $denied.AddAccessRule($rule)
          $failure=$null
          try {
            Set-Acl -LiteralPath $key -AclObject $denied
            $blocked=$false
            try { New-ItemProperty -LiteralPath $key -Name 'CFHDenialProbe' -Value 'test' -ErrorAction Stop | Out-Null } catch { if ($_.Exception -is [System.UnauthorizedAccessException] -or $_.Exception -is [System.Security.SecurityException] -or $_.Exception.InnerException -is [System.UnauthorizedAccessException] -or $_.CategoryInfo.Category -eq [System.Management.Automation.ErrorCategory]::PermissionDenied) { $blocked=$true } else { throw } }
            if(-not $blocked){throw 'SetValue denial did not take effect'}; Write-Output 'SetValue denial verified'
            $uninstaller=Join-Path $dir 'unins000.exe'
            $p=Start-Process $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=$env:RUNNER_TEMP\denied-uninstall.log") -PassThru
            if(!$p.WaitForExit(45000)){Stop-Process -Id $p.Id -Force; throw 'Denied uninstall hung'}
            Get-ItemProperty -LiteralPath $key | Format-List | Out-String | Write-Output
            Write-Output "DENIED UNINSTALL EXIT: $($p.ExitCode)"
            if(!(Test-Path "$env:RUNNER_TEMP\denied-uninstall.log")){throw 'Missing uninstall log'}
            $log=Get-Content "$env:RUNNER_TEMP\denied-uninstall.log" -Raw
            if($log -notmatch 'Could not remove CFH file-type registration'){throw 'Expected cleanup failure was absent from uninstall log'}
            $log -split "`n" | Select-String -Pattern 'Could not remove CFH|error|exception'
            if($p.ExitCode -eq 0){throw 'Uninstall returned success despite denied registry cleanup'}
          } catch {
            $failure=$_
            Write-Output "Denial test error: $failure"
          } finally {
            if(!(Test-Path $key)){throw 'Denied registry key disappeared unexpectedly'}; if(Test-Path $key){Set-Acl -LiteralPath $key -AclObject $original; if((Get-Acl -LiteralPath $key).Sddl -ne $original.Sddl){throw 'Registry ACL restoration mismatch'}; Write-Output 'Original registry ACL restored'}
          }
          if(!(Test-Path (Join-Path $dir 'unins000.exe'))){throw 'Uninstaller unavailable for recovery'}
          $p=Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Recovery uninstall failed: $($p.ExitCode)"}
          if(Test-Path (Join-Path $dir 'program\soffice.exe')){throw 'Executable remains after recovery'} 
          if(Test-Path 'HKCU:\Software\Classes\Applications\CFHOffice.exe'){throw 'Owned registration remains after recovery'}
          Write-Output 'Uninstall completed after restoring registry access'
          if($failure){throw $failure}



