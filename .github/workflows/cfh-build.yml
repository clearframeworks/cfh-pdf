name: CFH PDF dependency reachability investigation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  investigate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 824edd8a3f4f7622aa23c85831d5e816cac99b68
          persist-credentials: false
      - name: Inspect candidate references
        shell: pwsh
        run: |
          Write-Output 'Searching qpdf source for affected TurboJPEG loader APIs:'
          git grep -n -i -E 'tj3LoadImage|tjLoadImage|rdpng' -- ':!*.md' ':!*.json'
          if($LASTEXITCODE -eq 1){Write-Output 'No direct references in checked-in source'} elseif($LASTEXITCODE -ne 0){throw 'Search failed'}
          Write-Output 'TurboJPEG and JPEG API references:'
          git grep -n -i -E 'tj3|turbojpeg|jpeg_Create|jpeg_read' -- libqpdf qpdf CMakeLists.txt
          if($LASTEXITCODE -gt 1){throw 'Search failed'}
      - name: Inspect staged Windows executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42401786893 --repo clearframeworks/cfh-pdf -n cfh-pdf-engine-and-notices -D "$env:RUNNER_TEMP\stage"
          if($LASTEXITCODE -ne 0){throw 'Artifact download failed'}
          & "$env:RUNNER_TEMP\stage\qpdf.exe" --version
          Get-FileHash "$env:RUNNER_TEMP\stage\qpdf.exe" -Algorithm SHA256 | Format-List
          $vs=& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $dump=Get-ChildItem "$vs\VC\Tools\MSVC" -Filter dumpbin.exe -Recurse | Where-Object {$_.FullName -match 'Hostx64\\x64'} | Select-Object -First 1
          & $dump.FullName /IMPORTS "$env:RUNNER_TEMP\stage\qpdf.exe"