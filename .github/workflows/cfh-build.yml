name: CFH Office fixture dependency inventory
on:
  workflow_dispatch:
permissions: {}
jobs:
  inventory:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Download exact test wheels
        shell: pwsh
        run: |
          $python=(Get-Command python).Source
          & $python -m pip download --only-binary=:all: --dest "$env:RUNNER_TEMP\wheels" python-docx==1.1.2 openpyxl==3.1.5 python-pptx==1.0.2 lxml==5.4.0 typing-extensions==4.13.2 pillow==11.2.1 XlsxWriter==3.2.3 et-xmlfile==2.0.0
          if($LASTEXITCODE -ne 0){throw 'Wheel download failed'}
          Get-ChildItem "$env:RUNNER_TEMP\wheels\*.whl" | Sort-Object Name | ForEach-Object { Write-Output "$($_.Name) $((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" }
