name: Inspect newer qpdf dependency cache
on:
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify and inspect upstream archive
        run: |
          set -euo pipefail
          url='https://github.com/qpdf/qpdf/releases/download/vcpkg-cache-v1/vcpkg-2026-11-05T04.32.30%2B00.00.zip'
          curl -fLsS "$url" -o "$RUNNER_TEMP/vcpkg.zip"
          echo 'd0bae754e066873a85ee5c2f819c90b1ec2b2ace4932893cb23fd6d056a53f75  '"$RUNNER_TEMP/vcpkg.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/vcpkg.zip" 'vcpkg/installed/x64-windows-static/share/*/vcpkg.spdx.json' -d "$RUNNER_TEMP/cache"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'cache/vcpkg/installed/x64-windows-static/share'
          for path in sorted(root.glob('*/vcpkg.spdx.json')):
              data=json.loads(path.read_text())
              print(path.parent.name,[(x.get('name'),x.get('versionInfo')) for x in data.get('packages',[])])
          PY