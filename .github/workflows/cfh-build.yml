name: Verify public CFH PDF download
on:
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public installer without credentials
        run: |
          set -euo pipefail
          curl -fLsS 'https://github.com/clearframeworks/cfh-pdf/releases/download/cfh-pdf-0.1.0/CFH-PDF-Setup.exe' -o "$RUNNER_TEMP/setup.exe"
          echo 'a921a953041be099e596196bff524e13e0bb607a9227f5dcb4e511c528acba82  '"$RUNNER_TEMP/setup.exe" | sha256sum -c -
          echo PUBLIC_DOWNLOAD_VERIFIED