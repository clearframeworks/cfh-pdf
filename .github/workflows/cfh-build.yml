name: CFH Office installed format probe
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  fixture:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Fetch reviewed test harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c5085cda013e44046a33b8432bb829018a870a31
      - name: Verify and install exact installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip="$env:RUNNER_TEMP\installer.zip"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest 'https://api.github.com/repos/clearframeworks/cfh-pdf/actions/artifacts/13607111226/zip' -Headers $headers -OutFile $zip
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '79aa85430478e3dcb077bd9b9dbc21a446c5f7cd564f7eddd5797013e2d277ab'){throw "Installer archive digest mismatch: $hash"}
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP\package" -Force
          $setup=Get-ChildItem "$env:RUNNER_TEMP\package\*.exe" | Select-Object -First 1
          $hash=(Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '37ef3929d54edb8ffcc6dd26ce3cac649d947f536e8d963900811fe63f7a4586'){throw "Installer digest mismatch: $hash"}
          $dir="$env:RUNNER_TEMP\installed-office"
          $p=Start-Process $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=associations',"/DIR=$dir") -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Installer exit $($p.ExitCode)"}
          $exe=Join-Path $dir 'program\soffice.com'
          if(!(Test-Path $exe)){throw 'Installed executable missing'}
          $version=& $exe --version
          if($LASTEXITCODE -ne 0 -or ($version -join ' ') -notmatch 'CFH Office 26\.8\.2\.2 4f58d63d6beea882e8743564f58fcdaa2c26cb81'){throw "Wrong installed version: $version"}
          Write-Output "INSTALLED EXE SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"
      - name: Install hash-locked test dependencies
        shell: pwsh
        run: |
          $requirements=@'
          et-xmlfile==2.0.0 --hash=sha256:7a91720bc756843502c3b7504c77b8fe44217c85c537d85037f0f536151b2caa
          lxml==5.4.0 --hash=sha256:1dc4ca99e89c335a7ed47d38964abcb36c5910790f9bd106f2a8fa2ee0b909d2
          openpyxl==3.1.5 --hash=sha256:5282c12b107bffeef825f4617dc029afaf41d0ea60823bbb665ef3079dc79de2
          pillow==11.2.1 --hash=sha256:14e33b28bf17c7a38eede290f77db7c664e4eb01f7869e37fa98a5aa95978941
          python-docx==1.1.2 --hash=sha256:08c20d6058916fb19853fcf080f7f42b6270d89eac9fa5f8c15f691c0017fabe
          python-pptx==1.0.2 --hash=sha256:160838e0b8565a8b1f67947675886e9fea18aa5e795db7ae531606d68e785cba
          typing-extensions==4.13.2 --hash=sha256:a439e7c04b49fec3e5d3e2beaa21755cadbbdc391694e28ccdd36ca4a1408f8c
          XlsxWriter==3.2.3 --hash=sha256:593f8296e8a91790c6d0378ab08b064f34a642b3feb787cf6738236bd0a4860d
          '@
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\requirements.txt",$requirements,[Text.Encoding]::ASCII)
          $python=(Get-Command python).Source
          $version=& $python --version
          if($version -notmatch '^Python 3\.12\.'){throw "Expected Python 3.12: $version"}
          & $python -m venv "$env:RUNNER_TEMP\fixture-venv"
          if($LASTEXITCODE -ne 0){throw 'venv creation failed'}
          $python="$env:RUNNER_TEMP\fixture-venv\Scripts\python.exe"
          & $python -m pip install --require-hashes --only-binary=:all: -r "$env:RUNNER_TEMP\requirements.txt"
          if($LASTEXITCODE -ne 0){throw 'Dependency installation failed'}
          & $python -m pip freeze
      - name: Open XLSX and PPTX via registered command executable
        shell: pwsh
        timeout-minutes: 5
        run: |
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class CFHMultiInput {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f,uint dx,uint dy,uint data,UIntPtr extra);
          }
          "@
          $dir="$env:RUNNER_TEMP\installed-office"
          $exe="$dir\program\CFHOffice.exe"
          $registry=(Get-Item 'HKCU:\Software\Classes\Applications\CFHOffice.exe\shell\open\command').GetValue('')
          if($registry -ne "`"$exe`" `"%1`""){throw "Unexpected registered command: $registry"}
          $py="$env:RUNNER_TEMP\fixture-venv\Scripts\python.exe"
          $xlsx="$env:RUNNER_TEMP\CFH test spreadsheet.xlsx"
          $pptx="$env:RUNNER_TEMP\CFH test presentation.pptx"
          & $py -c 'from openpyxl import Workbook; import sys; w=Workbook(); w.active["A1"]=42; w.save(sys.argv[1])' $xlsx
          if($LASTEXITCODE -ne 0){throw 'Spreadsheet fixture failed'}
          & $py -c 'from pptx import Presentation; import sys; p=Presentation(); p.slides.add_slide(p.slide_layouts[0]).shapes.title.text="CFH synthetic slide"; p.save(sys.argv[1])' $pptx
          if($LASTEXITCODE -ne 0){throw 'Presentation fixture failed'}
          $root=[Windows.Automation.AutomationElement]::RootElement
          $cond=[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Window)
          foreach($test in @(@($xlsx,'CFH test spreadsheet','Calc'),@($pptx,'CFH test presentation','Impress'))){
            $process=Start-Process $exe -ArgumentList @("`"$($test[0])`"") -PassThru
            if(!$process.WaitForExit(30000) -or $process.ExitCode -ne 0){throw "Wrapper failed: $($test[1])"}
            $found=$null
            for($i=0;$i -lt 30;$i++){
              foreach($window in $root.FindAll([Windows.Automation.TreeScope]::Children,$cond)){
                if($window.Current.Name -like "*$($test[1])*$($test[2])*" ){
                  $owner=Get-Process -Id $window.Current.ProcessId -ErrorAction SilentlyContinue
                  if($owner -and $owner.Path -and $owner.Path.StartsWith($dir,[StringComparison]::OrdinalIgnoreCase)){$found=$window;break}
                }
              }
              if($found){break}; Start-Sleep -Seconds 2
            }
            if(!$found){throw "Expected installed $($test[2]) window not found"}
            Write-Output "OBSERVED $($test[2]) WINDOW: $($found.Current.Name) PID $($found.Current.ProcessId)"
            $welcome=$found.FindFirst([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,'Welcome to CFH Office!'))
            if($welcome){$rect=$welcome.Current.BoundingRectangle; [CFHMultiInput]::SetCursorPos([int]($rect.Right-15),[int]($rect.Top+15)) | Out-Null; [CFHMultiInput]::mouse_event(2,0,0,0,[UIntPtr]::Zero); [CFHMultiInput]::mouse_event(4,0,0,0,[UIntPtr]::Zero); Start-Sleep -Seconds 3}
          }
          Get-Process soffice* -ErrorAction SilentlyContinue | Stop-Process -Force