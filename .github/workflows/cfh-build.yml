name: CFH Office distribution inventory
on:
  workflow_dispatch:
permissions:
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect exact Office build archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/clearframeworks/cfh-pdf/actions/artifacts/13603618108/zip -o "$RUNNER_TEMP/office.zip"
          echo '959e433c61c13e2c72c85dd927a6d98200de9797c82a384c39e5942493b07391  '"$RUNNER_TEMP/office.zip" | sha256sum -c -
          python3 - <<'PY'
          import os, re, zipfile
          z=zipfile.ZipFile(os.path.join(os.environ['RUNNER_TEMP'],'office.zip'))
          names=z.namelist()
          print('TOTAL ARCHIVE ENTRIES',len(names))
          for n in ('LICENSE.html','NOTICE'):
              data=z.read(n)
              print('NOTICE FILE',n,'bytes',len(data),'sha256',__import__('hashlib').sha256(data).hexdigest())
              for term in ('Mozilla Public License','Apache License','GNU LESSER','MIT License','BSD License'):
                  print('NOTICE TERM',n,term,term.casefold() in data.decode('utf-8','replace').casefold())
          for title,pattern in [('LICENSE OR NOTICE',r'(^|/)(license|licence|notice|copying|readme)([._/-]|$)'),('WINDOWS RUNTIME',r'(^|/)(vcruntime|msvcp|ucrtbase|api-ms-win).*\.(dll|exe)$'),('EXECUTABLES AND LIBRARIES',r'(^|/)program/[^/]+\.(dll|exe|com)$')]:
              matches=[n for n in names if re.search(pattern,n,re.I)]
              print(title,'COUNT',len(matches))
              for n in matches[:150]: print(n)
          out=os.path.join(os.environ['RUNNER_TEMP'],'office-program')
          os.makedirs(out,exist_ok=True)
          for n in names:
              if re.fullmatch(r'program/[^/]+\.(?:dll|exe|com)',n,re.I):
                  z.extract(n,out)
          PY
          python3 - <<'PY'
          import os,zipfile,re,html
          z=zipfile.ZipFile(os.path.join(os.environ['RUNNER_TEMP'],'office.zip'))
          text=z.read('LICENSE.html').decode('utf-8','replace')
          headings=re.findall(r'<h[1-6][^>]*>(.*?)</h[1-6]>',text,re.I|re.S)
          print('LICENSE HEADINGS',len(headings))
          for h in headings:
              print('HEADING',html.unescape(re.sub('<[^>]*>',' ',h)).strip())
          import json,urllib.request
          req=urllib.request.Request('https://api.github.com/repos/clearframeworks/cfh-office/git/trees/4f58d63d6beea882e8743564f58fcdaa2c26cb81?recursive=1',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          tree=json.load(urllib.request.urlopen(req))
          if tree.get('truncated'): raise RuntimeError('Source tree inventory truncated')
          dirs=sorted({x['path'].split('/')[1] for x in tree['tree'] if x['path'].startswith('external/') and len(x['path'].split('/'))>1})
          missing=[d for d in dirs if not re.search(re.escape(d),text,re.I)]
          print('EXTERNAL DIRECTORY NAMES',len(dirs),'NOT TEXTUALLY MATCHED',len(missing))
          for d in missing: print('UNMATCHED NAME',d)
          for name in ['libxml2','zlib','OpenSSL','ICU','libpng','libjpeg','Python','Mozilla Public License']:
              print('NOTICE MATCH',name, bool(re.search(re.escape(name),text,re.I)))
          PY

