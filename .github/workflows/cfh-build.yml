name: CFH Office installer probe
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Fetch exact build artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip="$env:RUNNER_TEMP\office.zip"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest 'https://api.github.com/repos/clearframeworks/cfh-pdf/actions/artifacts/13603618108/zip' -Headers $headers -OutFile $zip
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '959e433c61c13e2c72c85dd927a6d98200de9797c82a384c39e5942493b07391'){throw "Build artifact digest mismatch: $hash"}
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP\office" -Force
          $exe="$env:RUNNER_TEMP\office\program\soffice.com"
          if(!(Test-Path $exe)){throw 'Expected built console executable not found'}
          $version=& $exe --version
          if($LASTEXITCODE -ne 0 -or ($version -join ' ') -notmatch 'CFH Office 26\.8\.2\.2 4f58d63d6beea882e8743564f58fcdaa2c26cb81'){throw "Unexpected built version: $version"}
          Write-Output "Built version: $version"
      - name: Package installer
        shell: pwsh
        run: |
          $iscc="${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if(!(Test-Path $iscc)){throw 'Inno Setup unavailable on runner'}
          $launcher=@'
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.Windows.Forms;
          static class CFHOfficeLauncher {
            [STAThread] static int Main(string[] args) {
              if(args.Length != 1 || args[0].IndexOf('"') >= 0) { MessageBox.Show("Choose one document to open.","CFH Office"); return 2; }
              try {
                string file=Path.GetFullPath(args[0]);
                string ext=Path.GetExtension(file).ToLowerInvariant();
                if(!File.Exists(file) || Array.IndexOf(new[]{".docx",".odt",".xlsx",".ods",".pptx",".odp"},ext)<0) { MessageBox.Show("Choose an existing supported document.","CFH Office"); return 2; }
                string dir=AppDomain.CurrentDomain.BaseDirectory;
                var info=new ProcessStartInfo(Path.Combine(dir,"soffice.exe"),"\""+file+"\"");
                info.WorkingDirectory=dir; info.UseShellExecute=false;
                Process.Start(info); return 0;
              } catch(Exception e) { MessageBox.Show("Could not open the document: "+e.Message,"CFH Office"); return 1; }
            }
          }
          '@
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\CFHOfficeLauncher.cs",$launcher,[Text.Encoding]::UTF8)
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x64 /reference:System.Windows.Forms.dll "/out:$env:RUNNER_TEMP\CFHOffice.exe" "$env:RUNNER_TEMP\CFHOfficeLauncher.cs"
          if($LASTEXITCODE -ne 0){throw 'CFH launcher compile failed'}
          $recipe=@'
          #define AppName "CFH Office"
          [Setup]
          AppId={{B94D8A10-7932-4DE1-8C83-583AD60C2B88}
          AppName={#AppName}
          AppVersion=26.8.2.2
          AppPublisher=Coders for Humanity
          DefaultDirName={localappdata}\Programs\CFH Office
          PrivilegesRequired=lowest
          DefaultGroupName=CFH Office
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          Compression=lzma2/fast
          SolidCompression=yes
          ChangesAssociations=yes
          OutputDir=OUTPUT_DIR
          OutputBaseFilename=CFH-Office-26.8.2.2-setup
          UninstallDisplayIcon={app}\program\soffice.exe
          [Files]
          Source: "SOURCE_DIR\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "LAUNCHER_PATH"; DestDir: "{app}\program"; Flags: ignoreversion
          [Icons]
          Name: "{autoprograms}\CFH Office"; Filename: "{app}\program\soffice.exe"
          [Tasks]
          Name: associations; Description: "Add CFH Office to Open with for common document formats"; Flags: unchecked
          [Registry]
          Root: HKCU; Subkey: "Software\Classes\Applications\CFHOffice.exe"; ValueType: string; ValueName: "FriendlyAppName"; ValueData: "CFH Office"; Tasks: associations
          Root: HKCU; Subkey: "Software\Classes\Applications\CFHOffice.exe"; ValueType: string; ValueName: "CFHOwner"; ValueData: "CFHOffice-4ec9d1ca"; Tasks: associations
          Root: HKCU; Subkey: "Software\Classes\Applications\CFHOffice.exe\shell\open\command"; ValueType: string; ValueData: """{app}\program\CFHOffice.exe"" ""%1"""; Tasks: associations
          Root: HKCU; Subkey: "Software\Classes\Applications\CFHOffice.exe\SupportedTypes"; ValueType: string; ValueName: ".docx"; ValueData: ""; Tasks: associations
          Root: HKCU; Subkey: "Software\Classes\Applications\CFHOffice.exe\SupportedTypes"; ValueType: string; ValueName: ".odt"; ValueData: ""; Tasks: associations
          Root: HKCU; Subkey: "Software\Classes\Applications\CFHOffice.exe\SupportedTypes"; ValueType: string; ValueName: ".xlsx"; ValueData: ""; Tasks: associations
          Root: HKCU; Subkey: "Software\Classes\Applications\CFHOffice.exe\SupportedTypes"; ValueType: string; ValueName: ".ods"; ValueData: ""; Tasks: associations
          Root: HKCU; Subkey: "Software\Classes\Applications\CFHOffice.exe\SupportedTypes"; ValueType: string; ValueName: ".pptx"; ValueData: ""; Tasks: associations
          Root: HKCU; Subkey: "Software\Classes\Applications\CFHOffice.exe\SupportedTypes"; ValueType: string; ValueName: ".odp"; ValueData: ""; Tasks: associations
          [Code]
          function InitializeSetup(): Boolean;
          var Installed, Major, Minor, Build: Cardinal;
              ErrorCode: Integer;
          begin
            Installed := 0; Major := 0; Minor := 0; Build := 0;
            Result := RegQueryDWordValue(HKLM64, 'SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64', 'Installed', Installed) and (Installed = 1) and
              RegQueryDWordValue(HKLM64, 'SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64', 'Major', Major) and
              RegQueryDWordValue(HKLM64, 'SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64', 'Minor', Minor) and
              RegQueryDWordValue(HKLM64, 'SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64', 'Bld', Build) and
              ((Major > 14) or ((Major = 14) and ((Minor > 44) or ((Minor = 44) and (Build >= 35207)))));
            if not Result then begin
              Log('Missing or outdated Microsoft Visual C++ x64 runtime; see https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist');
              if not WizardSilent then begin
                if MsgBox('CFH Office needs the Microsoft Visual C++ x64 runtime version 14.44.35207 or newer. Open Microsoft''s download page?', mbConfirmation, MB_YESNO) = IDYES then
                  ShellExec('open', 'https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist', '', '', SW_SHOWNORMAL, ewNoWait, ErrorCode);
              end;
            end;
          end;
          function PrepareToInstall(var NeedsRestart: Boolean): String;
          var Owner, Command: String;
          begin
            Result := '';
            if IsTaskSelected('associations') then begin
              if RegKeyExists(HKLM, 'Software\Classes\Applications\CFHOffice.exe') then
                Result := 'An existing system-wide CFH Office file-handler registration was found.'
              else if RegKeyExists(HKCU, 'Software\Classes\Applications\CFHOffice.exe') then begin
                if not RegQueryStringValue(HKCU, 'Software\Classes\Applications\CFHOffice.exe', 'CFHOwner', Owner) then Owner := '';
                if not RegQueryStringValue(HKCU, 'Software\Classes\Applications\CFHOffice.exe\shell\open\command', '', Command) then Command := '';
                if (Owner <> 'CFHOffice-4ec9d1ca') or (Command <> '"' + ExpandConstant('{app}\program\CFHOffice.exe') + '" "%1"') then
                  Result := 'An existing CFH Office file-handler registration belongs to another installation.';
              end;
            end;
          end;
          procedure RemoveOwnedRegistration();
          var Owner, Value, Key, Types, Cmd: String; I: Integer;
              Ext: array[0..5] of String;
          begin

            Key := 'Software\Classes\Applications\CFHOffice.exe';
            if not RegQueryStringValue(HKCU, Key, 'CFHOwner', Owner) then exit;
            if Owner <> 'CFHOffice-4ec9d1ca' then exit;
            Cmd := Key + '\shell\open\command';
            if not RegQueryStringValue(HKCU, Cmd, '', Value) then exit;
            if Value <> '"' + ExpandConstant('{app}\program\CFHOffice.exe') + '" "%1"' then exit;
            Types := Key + '\SupportedTypes';
            Ext[0]:='.docx'; Ext[1]:='.odt'; Ext[2]:='.xlsx'; Ext[3]:='.ods'; Ext[4]:='.pptx'; Ext[5]:='.odp';
            for I := 0 to 5 do
              if RegQueryStringValue(HKCU, Types, Ext[I], Value) and (Value = '') then if not RegDeleteValue(HKCU, Types, Ext[I]) then RaiseException('Could not remove CFH file-type registration: ' + Ext[I]);
            if RegQueryStringValue(HKCU, Cmd, '', Value) and (Value = '"' + ExpandConstant('{app}\program\CFHOffice.exe') + '" "%1"') then if not RegDeleteValue(HKCU, Cmd, '') then RaiseException('Could not remove CFH file-handler command');
            if RegQueryStringValue(HKCU, Key, 'FriendlyAppName', Value) and (Value = 'CFH Office') then if not RegDeleteValue(HKCU, Key, 'FriendlyAppName') then RaiseException('Could not remove CFH application name');
            if RegQueryStringValue(HKCU, Key, 'CFHOwner', Value) and (Value = 'CFHOffice-4ec9d1ca') then if not RegDeleteValue(HKCU, Key, 'CFHOwner') then RaiseException('Could not remove CFH ownership marker');
            if not RegDeleteKeyIfEmpty(HKCU, Types) then Log('SupportedTypes key retained or absent');
            if not RegDeleteKeyIfEmpty(HKCU, Cmd) then Log('Command key retained or absent');
            if not RegDeleteKeyIfEmpty(HKCU, Key + '\shell\open') then Log('Open key retained or absent');
            if not RegDeleteKeyIfEmpty(HKCU, Key + '\shell') then Log('Shell key retained or absent');
            if not RegDeleteKeyIfEmpty(HKCU, Key) then Log('Application key retained or absent');
          end;
          procedure CurUninstallStepChanged(CurUninstallStep: TUninstallStep);
          begin
            if CurUninstallStep = usUninstall then RemoveOwnedRegistration();
          end;
          procedure CurStepChanged(CurStep: TSetupStep);
          begin
            if (CurStep = ssInstall) and (not IsTaskSelected('associations')) then RemoveOwnedRegistration();
          end;
          '@
          $recipe=$recipe.Replace('SOURCE_DIR',"$env:RUNNER_TEMP\office").Replace('OUTPUT_DIR',"$env:RUNNER_TEMP\out").Replace('LAUNCHER_PATH',"$env:RUNNER_TEMP\CFHOffice.exe")
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\office.iss",$recipe,[Text.Encoding]::UTF8)
          & $iscc "$env:RUNNER_TEMP\office.iss"
          if($LASTEXITCODE -ne 0){throw "Installer build failed: $LASTEXITCODE"}
          $installer=Get-Item "$env:RUNNER_TEMP\out\CFH-Office-26.8.2.2-setup.exe"
          Write-Output "INSTALLER SHA256: $((Get-FileHash $installer -Algorithm SHA256).Hash)"
      - name: Install and smoke test
        shell: pwsh
        timeout-minutes: 10
        run: |
          $installer="$env:RUNNER_TEMP\out\CFH-Office-26.8.2.2-setup.exe"
          $dir="$env:RUNNER_TEMP\installed-office"
          if(Test-Path 'HKCU:\Software\Classes\Applications\CFHOffice.exe'){throw 'Pre-existing CFH application registration'}
          $collision='HKCU:\Software\Classes\Applications\CFHOffice.exe'
          New-Item -Path $collision -Force | Out-Null
          New-ItemProperty -Path $collision -Name 'CFHProbeSentinel' -Value 'preserve' | Out-Null
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=associations',"/DIR=$dir") -Wait -PassThru
          if($p.ExitCode -eq 0 -or (Get-ItemProperty -Path $collision -Name 'CFHProbeSentinel').CFHProbeSentinel -ne 'preserve'){throw 'Collision did not fail closed'}
          Remove-Item -LiteralPath $collision
          Write-Output 'Existing application registration preserved; conflicting install rejected'
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=',"/DIR=$dir") -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Opt-out install exit $($p.ExitCode)"}
          if(Test-Path 'HKCU:\Software\Classes\Applications\CFHOffice.exe'){throw 'Opt-out unexpectedly registered application'}
          $p=Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Opt-out uninstall exit $($p.ExitCode)"}
          Write-Output 'Opt-out install leaves Open With entries absent'
          $defaults=@{}
          Add-Type @'
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class CFHAssoc {
            [DllImport("shlwapi.dll",CharSet=CharSet.Unicode)] static extern int AssocQueryString(uint flags,uint kind,string assoc,string extra,StringBuilder output,ref uint length);
            public static string Executable(string ext) { uint n=0; int r=AssocQueryString(0,2,ext,null,null,ref n); if(n==0)return "<unassociated>"; var s=new StringBuilder((int)n); r=AssocQueryString(0,2,ext,null,s,ref n); return r==0?s.ToString():"<unassociated>"; }
          }
          '@
          $effective=@{}
          foreach($ext in @('.docx','.odt','.xlsx','.ods','.pptx','.odp')){
            $key="HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\FileExts\$ext\UserChoice"
            $defaults[$ext]=(Get-ItemProperty -LiteralPath $key -Name ProgId -ErrorAction SilentlyContinue).ProgId
            $effective[$ext]=[CFHAssoc]::Executable($ext)
          }
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=associations',"/DIR=$dir") -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Installer exit $($p.ExitCode)"}
          $exe=Join-Path $dir 'program\soffice.com'
          if(!(Test-Path $exe)){throw 'Installed console executable missing'}
          $version=& $exe --version
          if($LASTEXITCODE -ne 0 -or ($version -join ' ') -notmatch 'CFH Office 26\.8\.2\.2 4f58d63d6beea882e8743564f58fcdaa2c26cb81'){throw "Unexpected installed version: $version"}
          Write-Output "Installed version: $version"
          $templates=@(Get-ChildItem -LiteralPath (Join-Path $dir 'share\template') -File -Recurse -ErrorAction Stop)
          if($templates.Count -eq 0){throw 'Installed template inventory is empty'}
          Write-Output "Installed template files: $($templates.Count)"
          $expected=@{'.docx'=1;'.odt'=1;'.xlsx'=1;'.ods'=1;'.pptx'=1;'.odp'=1}
          $changed=@()
          foreach($ext in $expected.Keys){
            $key='HKCU:\Software\Classes\Applications\CFHOffice.exe\SupportedTypes'
            if((Get-Item $key -ErrorAction Stop).GetValueNames() -notcontains $ext){throw "Open With registration missing: $ext"}
            $choice="HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\FileExts\$ext\UserChoice"
            if((Get-ItemProperty -LiteralPath $choice -Name ProgId -ErrorAction SilentlyContinue).ProgId -ne $defaults[$ext]){throw "Default association changed: $ext"}
            $after=[CFHAssoc]::Executable($ext)
            Write-Output "ASSOCIATION $ext before=$($effective[$ext]) after=$after"
            if($after -ne $effective[$ext]){$changed += $ext}
          }
          if($changed.Count -gt 0){throw "Effective defaults changed: $($changed -join ', ')"}
          Write-Output 'Optional Open With registrations present; existing user defaults unchanged'
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=associations',"/DIR=$dir") -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Same-installation upgrade failed: $($p.ExitCode)"}
          Write-Output 'Same-installation opt-in upgrade succeeded'
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=',"/DIR=$dir") -Wait -PassThru
          if($p.ExitCode -ne 0 -or (Test-Path 'HKCU:\Software\Classes\Applications\CFHOffice.exe')){throw 'Opt-in to opt-out upgrade failed'}
          Write-Output 'Opt-in to opt-out upgrade removed owned registration'
          $p=Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=associations',"/DIR=$dir") -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Opt-out to opt-in upgrade failed'}
          Write-Output 'Opt-out to opt-in upgrade succeeded'
          New-ItemProperty -Path 'HKCU:\Software\Classes\Applications\CFHOffice.exe' -Name 'CFHProbeForeignValue' -Value 'preserve' | Out-Null
          Set-ItemProperty -Path 'HKCU:\Software\Classes\Applications\CFHOffice.exe' -Name 'FriendlyAppName' -Value 'Changed by another actor'
          Set-ItemProperty -Path 'HKCU:\Software\Classes\Applications\CFHOffice.exe\SupportedTypes' -Name '.docx' -Value 'changed'
          Set-Item -LiteralPath 'HKCU:\Software\Classes\Applications\CFHOffice.exe\shell\open\command' -Value 'changed-command'
      - name: Uninstall probe
        shell: pwsh
        timeout-minutes: 10
        run: |
          $dir="$env:RUNNER_TEMP\installed-office"
          $uninstaller=Join-Path $dir 'unins000.exe'
          if(!(Test-Path $uninstaller)){throw 'Uninstaller missing'}
          $p=Start-Process $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if($p.ExitCode -ne 0 -or (Test-Path (Join-Path $dir 'program\soffice.com'))){throw "Uninstall failed: $($p.ExitCode)"}
          foreach($ext in @('.odt','.xlsx','.ods','.pptx','.odp')){
            $key='HKCU:\Software\Classes\Applications\CFHOffice.exe\SupportedTypes'
            if(!(Test-Path $key) -or ((Get-Item $key).GetValueNames() -notcontains $ext)){throw "Modified registration was not preserved: $ext"}
          }
          $appKey='HKCU:\Software\Classes\Applications\CFHOffice.exe'
          if((Get-ItemProperty -Path $appKey -Name CFHProbeForeignValue -ErrorAction Stop).CFHProbeForeignValue -ne 'preserve'){throw 'Uninstall removed unrelated registry value'}
          if((Get-ItemProperty -Path $appKey -Name FriendlyAppName -ErrorAction Stop).FriendlyAppName -ne 'Changed by another actor'){throw 'Uninstall removed modified friendly name'}
          if((Get-ItemProperty -Path "$appKey\SupportedTypes" -Name '.docx' -ErrorAction Stop).'.docx' -ne 'changed'){throw 'Uninstall removed modified file type'}
          if((Get-Item "$appKey\shell\open\command").GetValue('') -ne 'changed-command'){throw 'Uninstall removed modified command'}
          Write-Output 'Unrelated application registry value preserved'
          Write-Output 'Installed executable removed by uninstaller'
      - name: Retain experimental installer
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cfh-office-installer-probe
          path: ${{ runner.temp }}\out\CFH-Office-26.8.2.2-setup.exe
          if-no-files-found: warn
          retention-days: 7
