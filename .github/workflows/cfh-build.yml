name: Office Windows build environment preflight
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Inspect Windows build prerequisites
        shell: pwsh
        run: |
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" | Select-Object DeviceID,Size,FreeSpace | Format-Table
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsArchitecture
          $wsl=Get-Command wsl.exe -ErrorAction SilentlyContinue
          if($wsl) { Write-Output "WSL command: $($wsl.Source)"; & $wsl.Source --status; Write-Output "WSL status exit: $LASTEXITCODE" } else { Write-Output 'WSL command unavailable' }
          cmd /c "wsl --list --verbose > %TEMP%\cfh-wsl.txt 2>&1"
          [IO.File]::ReadAllText("$env:TEMP\cfh-wsl.txt",[Text.Encoding]::Unicode) | Write-Output
          $vs=& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products '*' -property installationPath
          Write-Output "Visual Studio: $vs"
      - name: Probe WSL1 with verified Ubuntu image
        shell: pwsh
        timeout-minutes: 8
        run: |
          $url='https://cloud-images.ubuntu.com/wsl/releases/noble/current/ubuntu-noble-wsl-amd64-24.04lts.rootfs.tar.gz'
          $file="$env:RUNNER_TEMP\ubuntu-rootfs.tar.gz"
          Invoke-WebRequest $url -OutFile $file
          if((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2a790896740b14d637dbdc583cce1ba081ac53b9e9cdb46dc09a2f73abbd9934'){throw 'Ubuntu image checksum mismatch'}
          wsl.exe --import CFHProbe "$env:RUNNER_TEMP\wsl-probe" $file --version 1
          if($LASTEXITCODE -ne 0){throw "WSL1 import failed: $LASTEXITCODE"}
          wsl.exe -d CFHProbe -- /bin/sh -c 'uname -a; cat /etc/os-release'
          if($LASTEXITCODE -ne 0){throw 'WSL did not start'}
      - name: Inspect upstream build automation
        shell: pwsh
        timeout-minutes: 45
        run: |
          git clone --depth 1 https://git.libreoffice.org/lode "$env:RUNNER_TEMP\lode"
          if($LASTEXITCODE -ne 0){throw 'LODE clone failed'}
          Get-ChildItem "$env:RUNNER_TEMP\lode" | Select-Object -ExpandProperty Name
          Get-ChildItem "$env:RUNNER_TEMP\lode" -Filter '*readme*' -Recurse | Select-Object -ExpandProperty FullName
          Get-ChildItem "$env:RUNNER_TEMP\lode" -File | Where-Object { $_.Name -match 'README|setup' } | ForEach-Object { Get-Content $_.FullName -TotalCount 150 }
      - name: Fetch pinned office source in isolated runner
        shell: pwsh
        timeout-minutes: 25
        run: |
          $src="$env:RUNNER_TEMP\office-src"
          git clone --depth 1 --branch libreoffice-26.8.2.2 https://github.com/LibreOffice/core.git $src
          if($LASTEXITCODE -ne 0){throw 'Office source fetch failed'}
          $head=git -C $src rev-parse HEAD
          if($head -ne '9dea406ab7695df6325b11b0e19fdca8db4b7276'){throw "Unexpected office source $head"}
          Write-Output "OFFICE SOURCE VERIFIED: $head"
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" | Select-Object DeviceID,FreeSpace | Format-Table
      - name: Inspect LODE prerequisite checks
        shell: pwsh
        timeout-minutes: 5
        run: |
          $lode="$env:RUNNER_TEMP\lode"
          & "$env:ProgramFiles\Git\bin\bash.exe" -lc "cd `"`$RUNNER_TEMP/lode`" && ./setup --help"
          if($LASTEXITCODE -ne 0){throw 'LODE help failed'}
      - name: Check upstream office prerequisites
        shell: pwsh
        timeout-minutes: 10
        run: |
          & "$env:ProgramFiles\Git\bin\bash.exe" -lc "cd `"`$RUNNER_TEMP/lode`" && ./setup --prereq"
          if($LASTEXITCODE -ne 0){throw "LODE prerequisite check failed: $LASTEXITCODE"}