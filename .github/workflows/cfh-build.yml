name: CFH PDF Windows source build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Obtain exact upstream dependency archive
        shell: pwsh
        run: |
          $url='https://github.com/qpdf/qpdf/releases/download/v12.4.2/vcpkg.zip'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\vcpkg.zip"
          $actual=(Get-FileHash "$env:RUNNER_TEMP\vcpkg.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne '82005252fee032135d07c85ad7626a38f26fb253c1e098d1d185f315bea15ebb'){throw 'Upstream dependency archive hash mismatch'}
          tar -xf "$env:RUNNER_TEMP\vcpkg.zip" -C "$env:GITHUB_WORKSPACE"
          Get-ChildItem vcpkg\installed -Directory | Select-Object -ExpandProperty Name
          Get-ChildItem vcpkg\installed -Filter copyright -Recurse | Select-Object -ExpandProperty FullName
          Get-ChildItem vcpkg\installed\x64-windows-static\share -Recurse -File | Select-Object -ExpandProperty FullName
      - name: Configure and build qpdf
        shell: pwsh
        run: |
          cmake --preset msvc
          if($LASTEXITCODE -ne 0){throw 'Configure failed'}
          cmake --build cmake-build-msvc --config RelWithDebInfo --parallel 2
          if($LASTEXITCODE -ne 0){throw 'Build failed'}
          $exe=Get-ChildItem cmake-build-msvc -Filter qpdf.exe -Recurse | Select-Object -First 1
          if(-not $exe){throw 'qpdf executable missing'}
          & $exe.FullName --version
          if($LASTEXITCODE -ne 0){throw 'qpdf did not run'}
      - name: Record exact dependency manifests and stage executable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage="$env:RUNNER_TEMP\qpdf-stage"
          New-Item -ItemType Directory -Force "$stage\licenses" | Out-Null
          $exe=Get-ChildItem cmake-build-msvc -Filter qpdf.exe -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName "$stage\qpdf.exe"
          Copy-Item LICENSE.txt,NOTICE.md,CFH-PDF.ps1,CFH-PDF.cmd,CFH-FORK.md $stage
          foreach($pkg in @('zlib','libjpeg-turbo','libspng','openssl')) {
            $dir="vcpkg\installed\x64-windows-static\share\$pkg"
            Copy-Item "$dir\copyright" "$stage\licenses\$pkg.txt"
            Get-Content "$dir\vcpkg.spdx.json" -Raw | Write-Output
          }
      - name: Upload built engine and notices
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cfh-pdf-engine-and-notices
          path: ${{ runner.temp }}\qpdf-stage
          if-no-files-found: error