name: CFH PDF Windows source build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Obtain exact upstream dependency archive
        shell: pwsh
        run: |
          $url='https://github.com/qpdf/qpdf/releases/download/vcpkg-cache-v1/vcpkg-2026-11-05T04.32.30%2B00.00.zip'
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\vcpkg.zip"
          $actual=(Get-FileHash "$env:RUNNER_TEMP\vcpkg.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne 'd0bae754e066873a85ee5c2f819c90b1ec2b2ace4932893cb23fd6d056a53f75'){throw 'Upstream dependency archive hash mismatch'}
          tar -xf "$env:RUNNER_TEMP\vcpkg.zip" -C "$env:GITHUB_WORKSPACE"
          Get-ChildItem vcpkg\installed -Directory | Select-Object -ExpandProperty Name
          Get-ChildItem vcpkg\installed -Filter copyright -Recurse | Select-Object -ExpandProperty FullName
          Get-ChildItem vcpkg\installed\x64-windows-static\share -Recurse -File | Select-Object -ExpandProperty FullName
      - name: Configure and build qpdf
        shell: pwsh
        run: |
          cmake --preset msvc -DCMAKE_EXE_LINKER_FLAGS=/MAP
          if($LASTEXITCODE -ne 0){throw 'Configure failed'}
          cmake --build cmake-build-msvc --config RelWithDebInfo --parallel 2
          if($LASTEXITCODE -ne 0){throw 'Build failed'}
          $exe=Get-ChildItem cmake-build-msvc -Filter qpdf.exe -Recurse | Select-Object -First 1
          if(-not $exe){throw 'qpdf executable missing'}
          & $exe.FullName --version
          if($LASTEXITCODE -ne 0){throw 'qpdf did not run'}
      - name: Stage supported Windows runtime
        shell: pwsh
        run: |
          cmake --install cmake-build-msvc --config RelWithDebInfo --prefix "$env:RUNNER_TEMP\qpdf-installed"
          if($LASTEXITCODE -ne 0){throw 'CMake install failed'}
          Get-ChildItem "$env:RUNNER_TEMP\qpdf-installed" -Filter '*.dll' -Recurse | Select-Object -ExpandProperty FullName
          $maps=Get-ChildItem cmake-build-msvc -Filter qpdf.map -Recurse
          if(-not $maps){throw 'qpdf link map missing'}
          foreach($map in $maps){
            $matches=Select-String -Path $map.FullName -Pattern 'tj3LoadImage|tjLoadImage|start_input_png'
            if($matches){$matches | Write-Output; throw 'Affected image loader appears in link map'}
          }
          Write-Output 'AFFECTED TURBOJPEG LOADER SYMBOLS NOT FOUND IN QPDF LINK MAP'
      - name: Record exact dependency manifests and stage executable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage="$env:RUNNER_TEMP\qpdf-stage"
          New-Item -ItemType Directory -Force "$stage\licenses" | Out-Null
          $exe=Get-ChildItem cmake-build-msvc -Filter qpdf.exe -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName "$stage\qpdf.exe"
          foreach($name in @('MSVCP140.dll','VCRUNTIME140.dll','VCRUNTIME140_1.dll')){ $dll=Get-ChildItem "$env:RUNNER_TEMP\qpdf-installed" -Filter $name -Recurse | Select-Object -First 1; if(-not $dll){throw "Runtime missing: $name"}; Copy-Item $dll.FullName $stage }
          Copy-Item LICENSE.txt,NOTICE.md,CFH-PDF.ps1,CFH-PDF.cmd,CFH-FORK.md $stage
          foreach($pkg in @('zlib','libjpeg-turbo','libspng','openssl')) {
            $dir="vcpkg\installed\x64-windows-static\share\$pkg"
            Copy-Item "$dir\copyright" "$stage\licenses\$pkg.txt"
            Get-Content "$dir\vcpkg.spdx.json" -Raw | Write-Output
          }
      - name: Upload built engine and notices
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cfh-pdf-engine-and-notices
          path: ${{ runner.temp }}\qpdf-stage
          if-no-files-found: error