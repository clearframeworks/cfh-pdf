name: CFH Office installed UI probe
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  ui:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Install exact experimental package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip="$env:RUNNER_TEMP\installer.zip"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest 'https://api.github.com/repos/clearframeworks/cfh-pdf/actions/artifacts/13606783929/zip' -Headers $headers -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '14c4d37e2947d66c9fcad705e8edbc71e44ab43596558c8e3d4b7fad8012a383'){throw 'Archive digest mismatch'}
          Expand-Archive $zip "$env:RUNNER_TEMP\package" -Force
          $setup=Get-ChildItem "$env:RUNNER_TEMP\package\*.exe" | Select-Object -First 1
          if((Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne '330efe105cfd966a5a8bc3abf73b3a3432ea3651e08b33d449dd2ccfd2983d24'){throw 'Installer digest mismatch'}
          $dir="$env:RUNNER_TEMP\installed-office"
          $p=Start-Process $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=associations',"/DIR=$dir") -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Installer exit $($p.ExitCode)"}
      - name: Launch synthetic document with default runner profile
        shell: pwsh
        timeout-minutes: 3
        run: |
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $dir="$env:RUNNER_TEMP\installed-office"
          $exe=Join-Path $dir 'program\CFHOffice.exe'
          $existing=@(Get-ChildItem -LiteralPath $env:APPDATA -Directory | Where-Object { $_.Name -match '^(LibreOffice|CFH Office)$' })
          if($existing.Count -gt 0){throw "Default Office profile already exists: $($existing.Name -join ', ')"}
          Write-Output 'No default LibreOffice or CFH Office profile directory before launch'
          $file="$env:RUNNER_TEMP\CFH UI fixture with spaces.docx"
          Add-Type -AssemblyName System.IO.Compression
          $archive=[IO.Compression.ZipFile]::Open($file,[IO.Compression.ZipArchiveMode]::Create)
          try {
            $parts=@{
              '[Content_Types].xml'='<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'
              '_rels/.rels'='<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'
              'word/document.xml'='<?xml version="1.0" encoding="UTF-8"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>CFH synthetic GUI fixture</w:t></w:r></w:p><w:sectPr/></w:body></w:document>'
            }
            foreach($name in $parts.Keys){$entry=$archive.CreateEntry($name); $writer=[IO.StreamWriter]::new($entry.Open(),[Text.UTF8Encoding]::new($false)); try {$writer.Write($parts[$name])} finally {$writer.Dispose()}}
          } finally {$archive.Dispose()}
          $profile=([Uri]::new("$env:RUNNER_TEMP\fresh-ui-profile")).AbsoluteUri
          $launched=Start-Process $exe -ArgumentList @("`"$file`"") -PassThru
          $root=[Windows.Automation.AutomationElement]::RootElement
          $condition=[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Window)
          $found=$null
          for($i=0;$i -lt 30;$i++){
            $windows=$root.FindAll([Windows.Automation.TreeScope]::Children,$condition)
            foreach($window in $windows){
              if($window.Current.Name -match 'CFH UI fixture with spaces'){
                $proc=Get-Process -Id $window.Current.ProcessId -ErrorAction SilentlyContinue
                if($proc -and $proc.Path -and $proc.Path.StartsWith($dir,[StringComparison]::OrdinalIgnoreCase)){$found=$window; break}
              }
            }
            if($found){break}
            Start-Sleep -Seconds 2
          }
          if(!$found){
            $launched.Refresh(); Write-Output "LAUNCHER EXITED: $($launched.HasExited)"
            if($launched.HasExited){Write-Output "LAUNCHER EXIT CODE: $($launched.ExitCode)"}
            foreach($window in $root.FindAll([Windows.Automation.TreeScope]::Children,$condition)){Write-Output "WINDOW: $($window.Current.Name) PID $($window.Current.ProcessId)"}
            Get-Process CFHOffice,soffice* -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,Path,MainWindowTitle | Format-List
            throw 'Synthetic document window was not observed via UI Automation'
          }
          Write-Output "OBSERVED DOCUMENT WINDOW: $($found.Current.Name); PID: $($found.Current.ProcessId); EXE: $((Get-Process -Id $found.Current.ProcessId).Path)"
          $items=$found.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
          $names=@(foreach($item in $items){if($item.Current.Name){$item.Current.Name}})
          Write-Output "UI elements: $($items.Count)"
          Write-Output "Named elements: $(($names | Select-Object -First 50) -join ' | ')"
          if($names -match '(?i)donate'){throw 'Visible donation control found in fresh profile'}
          Write-Output 'Donation check limited to exposed UI elements; unopened menus remain unverified.'
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class CFHWindow {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
          }
          '@
          Write-Output "Initial foreground request: $([CFHWindow]::SetForegroundWindow([IntPtr]$found.Current.NativeWindowHandle))"
          $welcome=$found.FindFirst([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,'Welcome to CFH Office!'))
          if(!$welcome){throw 'Expected first-run welcome dialog missing'}
          $wrect=$welcome.Current.BoundingRectangle
          [CFHWindow]::SetCursorPos([int]($wrect.Right-15),[int]($wrect.Top+15)) | Out-Null
          [CFHWindow]::mouse_event(2,0,0,0,[UIntPtr]::Zero); [CFHWindow]::mouse_event(4,0,0,0,[UIntPtr]::Zero)
          Start-Sleep -Seconds 3
          $welcome=$found.FindFirst([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,'Welcome to CFH Office!'))
          if($welcome){throw 'Welcome dialog remained after close click'}
          Write-Output 'FIRST-RUN WELCOME CLOSED'
          Write-Output "Edit foreground request: $([CFHWindow]::SetForegroundWindow([IntPtr]$found.Current.NativeWindowHandle))"
          $popup=$found.FindFirst([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Window))
          $target=if($popup){$popup}else{$found}
          $rect=$target.Current.BoundingRectangle
          [CFHWindow]::SetCursorPos([int]($rect.Left+300),[int]($rect.Top+260)) | Out-Null
          [CFHWindow]::mouse_event(2,0,0,0,[UIntPtr]::Zero); [CFHWindow]::mouse_event(4,0,0,0,[UIntPtr]::Zero)
          Start-Sleep -Seconds 1
          [Windows.Forms.SendKeys]::SendWait('^{END}')
          [Windows.Forms.SendKeys]::SendWait(' CFH_GUI_SAVE_SENTINEL')
          [Windows.Forms.SendKeys]::SendWait('^s')
          Start-Sleep -Seconds 4
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class CFHPrintSave { [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr hwnd, IntPtr dc, uint flags); }
          '@
          $all=$found.FindAll([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.Condition]::TrueCondition)
          foreach($el in $all){Write-Output "POST-SAVE UI: $($el.Current.Name) $($el.Current.ControlType.ProgrammaticName) $($el.Current.BoundingRectangle)"}
          $popup=$found.FindFirst([Windows.Automation.TreeScope]::Descendants,[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Window))
          $target=if($popup){$popup}else{$found}
          $rect=$target.Current.BoundingRectangle
          $bmp=[Drawing.Bitmap]::new([int]$rect.Width,[int]$rect.Height); $g=[Drawing.Graphics]::FromImage($bmp); $dc=$g.GetHdc()
          try { $ok=[CFHPrintSave]::PrintWindow([IntPtr]$target.Current.NativeWindowHandle,$dc,2) } finally { $g.ReleaseHdc($dc) }
          if($ok){$bmp.Save("$env:RUNNER_TEMP\post-save.png",[Drawing.Imaging.ImageFormat]::Png)}
          $g.Dispose(); $bmp.Dispose()
          if(!$popup){Write-Output 'No save confirmation observed'} else {
          $confirm=$popup.Current.BoundingRectangle
          [CFHWindow]::SetCursorPos([int]($confirm.Right-75),[int]($confirm.Bottom-34)) | Out-Null
          [CFHWindow]::mouse_event(2,0,0,0,[UIntPtr]::Zero); [CFHWindow]::mouse_event(4,0,0,0,[UIntPtr]::Zero)
          Start-Sleep -Seconds 4
          Write-Output 'Selected observed Use Word 2007 Format confirmation'
          }
          $windows=$root.FindAll([Windows.Automation.TreeScope]::Children,$condition)
          foreach($window in $windows){Write-Output "PRE-CLOSE WINDOW: $($window.Current.Name) PID $($window.Current.ProcessId)"}
          Get-Process soffice* -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $archive=[IO.Compression.ZipFile]::OpenRead($file); try {$entry=$archive.GetEntry('word/document.xml'); if(!$entry){throw 'DOCX document XML missing'}; $reader=[IO.StreamReader]::new($entry.Open()); try {$saved=$reader.ReadToEnd()} finally {$reader.Dispose()}} finally {$archive.Dispose()}
          if($saved -notmatch 'CFH_GUI_SAVE_SENTINEL'){
            $windows=$root.FindAll([Windows.Automation.TreeScope]::Children,$condition)
            foreach($window in $windows){Write-Output "WINDOW DIAGNOSTIC: $($window.Current.Name) PID $($window.Current.ProcessId)"}
            throw 'Synthetic GUI edit was not saved to the original file'
          }
          Write-Output 'SYNTHETIC GUI EDIT AND SAVE VERIFIED'
      - name: Retain synthetic save diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: office-post-save-diagnostic
          path: ${{ runner.temp }}\post-save.png
          if-no-files-found: warn
          retention-days: 7
