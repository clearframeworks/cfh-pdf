name: CFH Office installed format probe
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  fixture:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Fetch reviewed test harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c5085cda013e44046a33b8432bb829018a870a31
      - name: Verify and install exact installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip="$env:RUNNER_TEMP\installer.zip"
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest 'https://api.github.com/repos/clearframeworks/cfh-pdf/actions/artifacts/13606783929/zip' -Headers $headers -OutFile $zip
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '14c4d37e2947d66c9fcad705e8edbc71e44ab43596558c8e3d4b7fad8012a383'){throw "Installer archive digest mismatch: $hash"}
          Expand-Archive -LiteralPath $zip -DestinationPath "$env:RUNNER_TEMP\package" -Force
          $setup=Get-ChildItem "$env:RUNNER_TEMP\package\*.exe" | Select-Object -First 1
          $hash=(Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne '330efe105cfd966a5a8bc3abf73b3a3432ea3651e08b33d449dd2ccfd2983d24'){throw "Installer digest mismatch: $hash"}
          $dir="$env:RUNNER_TEMP\installed-office"
          $p=Start-Process $setup.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir") -Wait -PassThru
          if($p.ExitCode -ne 0){throw "Installer exit $($p.ExitCode)"}
          $exe=Join-Path $dir 'program\soffice.com'
          if(!(Test-Path $exe)){throw 'Installed executable missing'}
          $version=& $exe --version
          if($LASTEXITCODE -ne 0 -or ($version -join ' ') -notmatch 'CFH Office 26\.8\.2\.2 4f58d63d6beea882e8743564f58fcdaa2c26cb81'){throw "Wrong installed version: $version"}
          Write-Output "INSTALLED EXE SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"
      - name: Install hash-locked test dependencies
        shell: pwsh
        run: |
          $requirements=@'
          et-xmlfile==2.0.0 --hash=sha256:7a91720bc756843502c3b7504c77b8fe44217c85c537d85037f0f536151b2caa
          lxml==5.4.0 --hash=sha256:1dc4ca99e89c335a7ed47d38964abcb36c5910790f9bd106f2a8fa2ee0b909d2
          openpyxl==3.1.5 --hash=sha256:5282c12b107bffeef825f4617dc029afaf41d0ea60823bbb665ef3079dc79de2
          pillow==11.2.1 --hash=sha256:14e33b28bf17c7a38eede290f77db7c664e4eb01f7869e37fa98a5aa95978941
          python-docx==1.1.2 --hash=sha256:08c20d6058916fb19853fcf080f7f42b6270d89eac9fa5f8c15f691c0017fabe
          python-pptx==1.0.2 --hash=sha256:160838e0b8565a8b1f67947675886e9fea18aa5e795db7ae531606d68e785cba
          typing-extensions==4.13.2 --hash=sha256:a439e7c04b49fec3e5d3e2beaa21755cadbbdc391694e28ccdd36ca4a1408f8c
          XlsxWriter==3.2.3 --hash=sha256:593f8296e8a91790c6d0378ab08b064f34a642b3feb787cf6738236bd0a4860d
          '@
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\requirements.txt",$requirements,[Text.Encoding]::ASCII)
          $python=(Get-Command python).Source
          $version=& $python --version
          if($version -notmatch '^Python 3\.12\.'){throw "Expected Python 3.12: $version"}
          & $python -m venv "$env:RUNNER_TEMP\fixture-venv"
          if($LASTEXITCODE -ne 0){throw 'venv creation failed'}
          $python="$env:RUNNER_TEMP\fixture-venv\Scripts\python.exe"
          & $python -m pip install --require-hashes --only-binary=:all: -r "$env:RUNNER_TEMP\requirements.txt"
          if($LASTEXITCODE -ne 0){throw 'Dependency installation failed'}
          & $python -m pip freeze
      - name: Inspect installed Impress window
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class CFHImpressCapture { [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr dc, uint flags); }
          "@
          $dir="$env:RUNNER_TEMP\installed-office"
          $python="$env:RUNNER_TEMP\fixture-venv\Scripts\python.exe"
          $file="$env:RUNNER_TEMP\cfh-impress-fixture.pptx"
          & $python -c 'from pptx import Presentation; from pptx.util import Inches; import sys; p=Presentation(); s=p.slides.add_slide(p.slide_layouts[6]); t=s.shapes.add_textbox(Inches(2),Inches(2),Inches(5),Inches(1)); t.text="CFH initial slide"; p.save(sys.argv[1])' $file
          if($LASTEXITCODE -ne 0){throw 'Fixture creation failed'}
          $profile=([Uri]::new("$env:RUNNER_TEMP\impress-profile")).AbsoluteUri
          Start-Process "$dir\program\soffice.exe" -ArgumentList @("-env:UserInstallation=$profile",'--impress',"`"$file`"") | Out-Null
          $root=[Windows.Automation.AutomationElement]::RootElement
          $condition=[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ControlTypeProperty,[Windows.Automation.ControlType]::Window)
          $found=$null
          for($i=0;$i -lt 45;$i++){
            foreach($w in $root.FindAll([Windows.Automation.TreeScope]::Children,$condition)){
              if($w.Current.Name -match 'cfh-impress-fixture'){
                $proc=Get-Process -Id $w.Current.ProcessId -ErrorAction SilentlyContinue
                if($proc -and $proc.Path.StartsWith($dir,[StringComparison]::OrdinalIgnoreCase)){$found=$w;break}
              }
            }
            if($found){break}; Start-Sleep -Seconds 2
          }
          if(!$found){throw 'Installed Impress window not found'}
          Start-Sleep -Seconds 15
          $r=$found.Current.BoundingRectangle
          Write-Output "IMPRESS WINDOW PID=$($found.Current.ProcessId) RECT=$r"
          $bmp=[Drawing.Bitmap]::new([int]$r.Width,[int]$r.Height); $g=[Drawing.Graphics]::FromImage($bmp); $dc=$g.GetHdc()
          try {$ok=[CFHImpressCapture]::PrintWindow([IntPtr]$found.Current.NativeWindowHandle,$dc,2)} finally {$g.ReleaseHdc($dc)}
          if(!$ok){throw 'PrintWindow failed'}
          $bmp.Save("$env:RUNNER_TEMP\impress-window.png",[Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $bmp.Dispose()
      - name: Retain synthetic window
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: impress-window
          path: ${{ runner.temp }}\impress-window.png
          if-no-files-found: ignore
